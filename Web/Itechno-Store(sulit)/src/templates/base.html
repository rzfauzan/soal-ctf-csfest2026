<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Itechno Store{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark">IT</span>
        <span>Itechno Store</span>
      </a>
      <nav class="nav">
        <a href="{{ url_for('index') }}">Catalog</a>
        <a href="{{ url_for('customer_login') }}">Account</a>
        <a href="{{ url_for('fake_admin') }}">Admin</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
