{% extends "base.html" %}
{% block title %}List Accounts - WHM{% endblock %}
{% block content %}
<section class="panel">
  <p class="eyebrow">WHM compatibility</p>
  <h1>Account List</h1>
  <table>
    <thead>
      <tr>
        <th>Domain</th>
        <th>Owner</th>
        <th>Package</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      {% for domain, owner, package, status in rows %}
      <tr>
        <td>{{ domain }}</td>
        <td>{{ owner }}</td>
        <td>{{ package }}</td>
        <td>{{ status }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
