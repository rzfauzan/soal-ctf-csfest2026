{% extends "base.html" %}
{% block title %}{{ product.name }} - Itechno Store{% endblock %}
{% block content %}
<section class="detail">
  <div class="detail-visual" style="--accent: {{ product.accent }}">
    <span>{{ product.category[:2].upper() }}</span>
  </div>
  <div class="detail-copy">
    <p class="eyebrow">{{ product.category }}</p>
    <h1>{{ product.name }}</h1>
    <strong>{{ product.price }}</strong>
    <p>{{ product.summary }}</p>
    <button type="button">Add to quote</button>
  </div>
</section>
{% endblock %}
